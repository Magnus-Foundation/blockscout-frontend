# Cloud Build pipeline for the Magnus blockscout-frontend fork.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'buildx'
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGISTRY}/blockscout-frontend:${_TAG}'
      - '-t'
      - '${_REGISTRY}/blockscout-frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGISTRY}/blockscout-frontend:latest'
      - '--build-arg'
      - 'GIT_COMMIT_SHA=${SHORT_SHA}'
      - '--build-arg'
      - 'GIT_TAG=${BRANCH_NAME}'
      - '--push'
      - '.'
    timeout: '3600s'

substitutions:
  _REGISTRY: asia-southeast1-docker.pkg.dev/prj-cs-loragon/fx-reporter
  _TAG: 'magnus-staccato'

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'
